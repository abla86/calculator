<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive JavaScript calculator with keyboard support">
  <title>JavaScript Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="calculator">
    <h1>Calculator</h1>

    <div class="display-container">
      <div id="previous-operation" class="previous-operation"></div>
      <div id="display" class="display">0</div>
    </div>

    <div class="buttons">
      <button class="function" data-action="clear">C</button>
      <button class="function" data-action="delete">⌫</button>
      <button class="operator" data-value="%">%</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equals" data-action="calculate">=</button>
    </div>

    <p class="keyboard-hint">Keyboard supported</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
